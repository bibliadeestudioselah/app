<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF7EF" />
  <meta name="description" content="Biblia de Estudio Selah — Una pausa que transforma, una Palabra que permanece." />
  <title>Biblia de Estudio Selah</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body data-theme="light">
  <div id="splash" class="splash">
    <div class="splash-logo">📖</div>
    <h1 class="splash-title">Biblia de Estudio <span>Selah</span></h1>
    <p class="splash-tagline">Donde la pausa se convierte en encuentro</p>
    <div class="splash-loader"></div>
  </div>

  <div id="app" class="app hidden">
    <header class="app-header">
      <button class="icon-btn" id="btn-menu" aria-label="Menú">☰</button>
      <h1 class="app-title" id="view-title">Inicio</h1>
      <button class="icon-btn" id="btn-settings" aria-label="Ajustes">⚙️</button>
    </header>
    <main class="app-main" id="app-main"></main>
    <nav class="app-nav" id="app-nav">
      <button class="nav-btn active" data-view="home"><span>🏠</span><small>Inicio</small></button>
      <button class="nav-btn" data-view="bible"><span>📖</span><small>Biblia</small></button>
      <button class="nav-btn" data-view="search"><span>🔍</span><small>Buscar</small></button>
      <button class="nav-btn" data-view="plans"><span>🗓️</span><small>Planes</small></button>
      <button class="nav-btn" data-view="library"><span>📚</span><small>Estudio</small></button>
    </nav>
  </div>

  <script src="js/minisearch.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/router.js"></script>
  <script src="js/bible.js"></script>
  <script src="js/search.js"></script>
  <script src="js/assistant.js"></script>
  <script src="js/library.js"></script>
  <script src="js/plans.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(r => console.log('✅ SW registrado:', r.scope))
          .catch(e => console.error('❌ SW error:', e));
      });
    }
  </script>
</body>
</html>
