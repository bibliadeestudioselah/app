<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1B2A41"/>
      <stop offset="100%" stop-color="#060A10"/>
    </radialGradient>

    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A5A22"/>
      <stop offset="15%" stop-color="#FCE181"/>
      <stop offset="30%" stop-color="#FFF8D6"/>
      <stop offset="50%" stop-color="#C99539"/>
      <stop offset="70%" stop-color="#F2D06B"/>
      <stop offset="85%" stop-color="#FFF8D6"/>
      <stop offset="100%" stop-color="#8A5A22"/>
    </linearGradient>

    <linearGradient id="goldVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C99539"/>
      <stop offset="40%" stop-color="#FFF8D6"/>
      <stop offset="60%" stop-color="#8A5A22"/>
      <stop offset="100%" stop-color="#FCE181"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo completo -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- 🌟 LA BIBLIA 🌟 -->
  <g transform="translate(256, 210)" filter="url(#dropShadow)">
    <rect x="-110" y="-90" width="22" height="180" rx="5" fill="#0D131C" stroke="url(#goldMetal)" stroke-width="3"/>
    <rect x="96" y="-86" width="12" height="172" rx="2" fill="#FBF7EF" stroke="#C99539" stroke-width="2"/>
    <rect x="-88" y="-90" width="184" height="180" rx="8" fill="#111827" stroke="url(#goldMetal)" stroke-width="4"/>
    <rect x="-80" y="-82" width="168" height="164" rx="4" fill="none" stroke="url(#goldMetal)" stroke-width="1.5" opacity="0.5"/>
    <path d="M 60 -90 L 80 -90 L 80 50 L 70 40 L 60 50 Z" fill="#A31621" stroke="#5A0A10" stroke-width="2"/>
    
    <!-- Cruz Dorada (Posición equilibrada para el Maskable) -->
    <g transform="translate(4, -10)" filter="url(#glow)">
      <!-- Sombra -->
      <path d="M -6 -50 L 6 -50 L 6 -27 L 28 -27 L 28 -13 L 6 -13 L 6 50 L -6 50 L -6 -13 L -28 -13 L -28 -27 L -6 -27 Z" fill="#000" opacity="0.5" transform="translate(2, 2)"/>
      <!-- Cruz -->
      <path d="M -6 -50 L 6 -50 L 6 -27 L 28 -27 L 28 -13 L 6 -13 L 6 50 L -6 50 L -6 -13 L -28 -13 L -28 -27 L -6 -27 Z" fill="url(#goldVert)"/>
    </g>
  </g>

  <text x="256" y="400" font-family="'Georgia', 'Times New Roman', serif" font-size="80" font-weight="bold" fill="url(#goldMetal)" text-anchor="middle" filter="url(#dropShadow)" letter-spacing="2">Selah</text>
</svg>